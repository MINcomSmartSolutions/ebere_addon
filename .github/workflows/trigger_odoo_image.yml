name: Trigger Odoo Image Build

on:
  push:
    branches: [ main ]

jobs:
  dispatch:
    name: Trigger Odoo Image Build
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # The Odoo image in DynamicTariffApp clones this repo's main, then tests and pushes it.
      # The secret is a fine-grained token with Contents: read and write on DynamicTariffApp, which repository_dispatch requires.
      - name: Dispatch ebere-addon-changed
        env:
          GH_TOKEN: ${{ secrets.DYNAMICTARIFFAPP_DISPATCH_TOKEN }}
        run: gh api repos/MINcomSmartSolutions/DynamicTariffApp/dispatches -f event_type=ebere-addon-changed
